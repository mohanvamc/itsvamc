name: Build portfolio

on:
  push:
    branches: [gh-pages]
    paths:
      - "content/**"
      - "templates/**"
      - "assets/**"
      - "build.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild site from content changes [skip ci]"
          file_pattern: |
            index.html
            resume.html
            .nojekyll
